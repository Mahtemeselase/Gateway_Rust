[package]
name = "mock_gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
# 1. The Asynchronous Engine
tokio = { version = "1.37", features = ["full"] }

# 2. The Network Boundary
axum = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# 3. Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 4. The Ledger
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "rust_decimal"] }
rust_decimal = "1.35"
rust_decimal_macros = "1.35"
uuid = { version = "1.8", features = ["v4", "serde"] }

# 5. Cryptography & Compliance
rsa = "0.9"
sha2 = "0.10"
base64 = "0.22"
zeroize = { version = "1.7", features = ["derive"] }

# 6. Observability & Errors
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
